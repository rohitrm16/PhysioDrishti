<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhysioDrishti — Online Physiotherapy</title>
    <meta name="description" content="Get back to doing what you love. Expert physiotherapy and orthopaedic care — from home or near you." />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { min-height: 100%; }
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @keyframes spin    { to { transform: rotate(360deg); } }
      @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.35} }
      @keyframes fadeUp  { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
      @keyframes ticker  { 0%{opacity:0;transform:translateY(-6px)} 10%,90%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(6px)} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
